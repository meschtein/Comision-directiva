<style>
:root{
  --bg:#F5F4F0;--surface:#fff;--border:#E0DED8;

  --c-proc:#1D4ED8;--bg-proc:#DBEAFE;
  --c-pend:#92400E;--bg-pend:#FEF3C7;
  --c-sin:#5F5E5A;--bg-sin:#EEEDE8;
  --p0-c:#4338CA;--p0-bg:#EEF2FF;--p0-bd:#C7D2FE;
  --p1-c:#0F766E;--p1-bg:#CCFBF1;--p1-bd:#99F6E4;

}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:56px}

/* HEADER */
.hdr{background:#1A1916;color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.hdr-top h1{font-size:15px;font-weight:600;letter-spacing:.02em}
.hdr-top span{font-size:10px;opacity:.4;font-family:monospace}
.legend{display:flex;flex-wrap:wrap;gap:10px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.6)}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ld-term{background:#4ade80}.ld-proc{background:#60a5fa}.ld-pend{background:#fbbf24}.ld-sin{background:#9ca3af}

/* FILTERS */
.filters{background:#1A1916;padding:0 12px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;position:sticky;top:80px;z-index:99}
.filters::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.55);font-family:inherit;transition:all .15s}
.pill.a-all{background:#fff;color:#1A1916;border-color:#fff}
.pill.a-p0{background:var(--p0-bg);color:var(--p0-c);border-color:var(--p0-bd)}
.pill.a-p1{background:var(--p1-bg);color:var(--p1-c);border-color:var(--p1-bd)}
.pill.a-p2{background:var(--p2-bg);color:var(--p2-c);border-color:var(--p2-bd)}
.pill.a-p3{background:var(--p3-bg);color:var(--p3-c);border-color:var(--p3-bd)}
.pill.a-p4{background:var(--p4-bg);color:var(--p4-c);border-color:var(--p4-bd)}
.pill.a-term{background:var(--bg-term);color:var(--c-term);border-color:#86efac}
.pill.a-proc{background:var(--bg-proc);color:var(--c-proc);border-color:#93c5fd}
.pill.a-pend{background:var(--bg-pend);color:var(--c-pend);border-color:#fcd34d}
.pill.a-sin{background:var(--bg-sin);color:var(--c-sin);border-color:#d1d5db}

/* STATS */
.stats{display:flex;gap:7px;padding:12px 12px 4px}
.stat{flex:1;background:var(--surface);border-radius:8px;padding:9px 8px 7px;text-align:center;border:1px solid var(--border)}
.sn{font-size:20px;font-weight:600;line-height:1}
.sl{font-size:9px;color:var(--text3);margin-top:3px;font-family:monospace;letter-spacing:.04em}
.n-term{color:var(--c-term)}.n-proc{color:var(--c-proc)}.n-pend{color:var(--c-pend)}.n-sin{color:var(--c-sin)}

/* GROUP */
.grp-hdr{display:flex;align-items:center;gap:10px;background:#1A1916;color:#fff;padding:8px 12px;border-radius:8px 8px 0 0;margin:14px 10px 0}
.grp-name{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-family:monospace}
.grp-count{font-size:10px;opacity:.4;font-family:monospace}

/* TABLE */
.tbl-wrap{margin:0 10px 2px;border-radius:0 0 8px 8px;overflow:hidden;border:1px solid var(--border);border-top:none}
table{width:100%;border-collapse:collapse;font-size:12px;background:var(--surface);table-layout:fixed}
th{background:#2E2D29;color:rgba(255,255,255,.5);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;text-align:left;font-family:monospace;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.4;word-break:normal;overflow-wrap:break-word}
tr:last-child td{border-bottom:none}
tr.row{cursor:pointer}
tr.row:hover td{background:#F5F3EE}
tr.row.expanded td{background:#F8F6F1}
.c-num{width:28px;color:var(--text3);font-family:monospace;font-size:11px}
.c-tema{width:auto}
.c-resp{width:90px}
.c-est{width:84px}
.c-arr{width:20px;color:var(--text3);font-size:13px;text-align:center}
.t-title{font-weight:600;color:var(--text);font-size:12px;line-height:1.35}
.t-sum{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.4}
.resp-wrap{display:flex;flex-wrap:wrap;gap:3px}
.rc{font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px;border:1px solid;white-space:nowrap}
.rc-p0{color:var(--p0-c);background:var(--p0-bg);border-color:var(--p0-bd)}
.rc-p1{color:var(--p1-c);background:var(--p1-bg);border-color:var(--p1-bd)}
.rc-p2{color:var(--p2-c);background:var(--p2-bg);border-color:var(--p2-bd)}
.rc-p3{color:var(--p3-c);background:var(--p3-bg);border-color:var(--p3-bd)}
.rc-p4{color:var(--p4-c);background:var(--p4-bg);border-color:var(--p4-bd)}
.sb{font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;font-family:monospace;white-space:nowrap}
.sb-term{background:var(--bg-term);color:var(--c-term)}
.sb-proc{background:var(--bg-proc);color:var(--c-proc)}
.sb-pend{background:var(--bg-pend);color:var(--c-pend)}
.sb-sin{background:var(--bg-sin);color:var(--c-sin)}

/* DETAIL ROW */
tr.detail-row td{padding:0;border-bottom:1px solid var(--border);background:#FAFAF7}
.detail-panel{padding:12px 14px 14px;display:none}
tr.detail-row.open .detail-panel{display:block}
.dp-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:3px 9px;border-radius:8px;font-family:monospace;margin-bottom:10px}
.dp-block{margin-bottom:10px}
.dp-block:last-child{margin-bottom:0}
.dp-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-family:monospace;margin-bottom:3px}
.dp-text{font-size:12px;color:var(--text2);line-height:1.6}
.dp-text.hi{color:var(--text);font-weight:500}
.note-inp{width:100%;margin-top:10px;padding:7px 10px;font-size:12px;font-family:inherit;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);resize:none;min-height:32px;line-height:1.5}
.note-inp:focus{outline:none;border-color:#1A1916}
.note-inp::placeholder{color:var(--text3)}

.arrow{display:inline-block;transition:transform .2s}
.expanded .arrow{transform:rotate(90deg)}
.empty{text-align:center;padding:48px 16px;color:var(--text3);font-size:13px}
</style>

   def:'Seguimiento con Daniel. Determinación exacta de qué hay que hacer en cada caso.',
   st:'',resp:['Patricia Labate'],s:'pend'},
  {g:'Seguridad (reuniones ant.)',n:29,
   t:'Cámaras internas',
   sum:'Avanzar una vez resueltas las cámaras externas.',
   d:'Sirven para tener de respaldo y consulta ante eventos.',
   def:'Resueltas cámaras externas avanzaremos con las cámaras internas.',
   st:'',resp:['Alejandro Zalazar','Patricia Labate'],s:'pend'},

   t:'Control de cámara en ingreso',
   sum:'La cámara existente funciona bien y podría evitar que salga el vigilador. Armar comunicación.',
   d:'La cámara existente en el ingreso funciona bien y podría evitar que salga el vigilador.',
   def:'Armar comunicación para enviar. Empezaríamos a la noche.',

var notes={}, filter='all', openDetail={};

function pi(n){return PF.indexOf(n);}
function fn(n){return n.split(' ')[0];}

function getData(){
  if(filter==='all') return T;
  if(filter.charAt(0)==='s'){
    var sk=filter.slice(1);
    return T.filter(function(t){return t.s===sk;});
  }
  var full=PF[parseInt(filter)];
  return T.filter(function(t){return t.resp.indexOf(full)>=0;});
}

function updateStats(d){
  document.getElementById('st-tot').textContent=d.length;
  document.getElementById('st-term').textContent=d.filter(function(t){return t.s==='term';}).length;
  document.getElementById('st-proc').textContent=d.filter(function(t){return t.s==='proc';}).length;
  document.getElementById('st-pend').textContent=d.filter(function(t){return t.s==='pend';}).length;
  document.getElementById('st-sin').textContent=d.filter(function(t){return t.s==='sin';}).length;
}

function respHtml(resp){
  if(!resp||!resp.length) return '<span style="color:var(--text3);font-size:11px">—</span>';
  return '<div class="resp-wrap">'+resp.map(function(r){
    return '<span class="rc rc-p'+pi(r)+'">'+fn(r)+'</span>';
  }).join('')+'</div>';
}

function detailHtml(t){
  return '<div class="detail-panel" id="dp-'+t.n+'">'+
    '<span class="dp-badge sb-'+t.s+'">'+ICON[t.s]+' '+SLABEL[t.s]+'</span>'+
    '<div class="dp-block"><div class="dp-label">Detalle</div><div class="dp-text">'+t.d+'</div></div>'+
    '<div class="dp-block"><div class="dp-label">Definición / acción</div><div class="dp-text hi">'+t.def+'</div></div>'+
    (t.st?'<div class="dp-block"><div class="dp-label">Estado actual</div><div class="dp-text">'+t.st+'</div></div>':'')+
    '<textarea class="note-inp" placeholder="Anotación..." rows="1" oninput="saveNote('+t.n+',this)">'+(notes[t.n]||'')+'</textarea>'+
  '</div>';
}

function render(){
  var d=getData();
  updateStats(d);
  var b=document.getElementById('board');
  if(!d.length){b.innerHTML='<div class="empty">Sin temas para este filtro.</div>';return;}
  var groups=[];
  d.forEach(function(t){if(groups.indexOf(t.g)<0)groups.push(t.g);});
  b.innerHTML=groups.map(function(g){
    var items=d.filter(function(t){return t.g===g;});
    var rows=items.map(function(t){
      var open=!!openDetail[t.n];
      return '<tr class="row'+(open?' expanded':'')+'" onclick="toggleDetail('+t.n+')">'+
          '<td class="c-num">'+t.n+'</td>'+
          '<td class="c-tema"><div class="t-title">'+t.t+'</div><div class="t-sum">'+t.sum+'</div></td>'+
          '<td class="c-resp">'+respHtml(t.resp)+'</td>'+
          '<td class="c-est"><span class="sb sb-'+t.s+'">'+SLABEL[t.s]+'</span></td>'+
          '<td class="c-arr"><span class="arrow">'+(open?'&#8964;':'&#8250;')+'</span></td>'+
        '</tr>'+
        '<tr class="detail-row'+(open?' open':'')+'">'+
          '<td colspan="5">'+detailHtml(t)+'</td>'+
        '</tr>';
    }).join('');
    return '<div class="grp-hdr">'+
        '<span class="grp-name">'+g+'</span>'+
        '<span class="grp-count">'+items.length+' temas</span>'+
      '</div>'+
      '<div class="tbl-wrap"><table>'+
        '<thead><tr>'+
          '<th class="c-num">#</th>'+
          '<th class="c-tema">Tema / resumen</th>'+
          '<th class="c-resp">Responsable</th>'+
          '<th class="c-est">Estado</th>'+
          '<th class="c-arr"></th>'+
        '</tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table></div>';
  }).join('');
  // restore textarea heights
  document.querySelectorAll('.note-inp').forEach(function(ta){
    if(ta.value){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}
  });
}

function toggleDetail(n){
  openDetail[n]=!openDetail[n];
  render();
  if(openDetail[n]){
    setTimeout(function(){
      var el=document.getElementById('dp-'+n);
      if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});
    },40);
  }
}

function saveNote(n,el){
  notes[n]=el.value;
  el.style.height='auto';el.style.height=el.scrollHeight+'px';
}

function setFilter(f,cls,el){
  filter=f;
  document.querySelectorAll('.pill').forEach(function(b){b.className='pill';});
  el.className='pill '+cls;
  render();
}

function buildFilters(){
  var f=document.getElementById('filters');
  function btn(label,fval,cls){
    var b=document.createElement('button');
    b.className='pill'+(fval==='all'?' a-all':'');
    b.textContent=label;
    b.onclick=function(){setFilter(fval,cls,b);};
    f.appendChild(b);
  }
  btn('Todos','all','a-all');
  PN.forEach(function(p,i){btn(p,String(i),'a-p'+i);});
  btn('Terminado','sterm','a-term');
  btn('En proceso','sproc','a-proc');
  btn('Pendiente','spend','a-pend');
  btn('Sin novedad','ssin','a-sin');
}

buildFilters();
render();
</script>
